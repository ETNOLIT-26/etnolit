
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETNOLIT V2 Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;background:#eef5f8;color:#18314f}
header{height:100vh;background:linear-gradient(rgba(8,25,42,.65),rgba(8,25,42,.75)),url('assets/sungai/sungai_01.jpg') center/cover fixed;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;position:relative}
header:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,180,0,.25),transparent 35%)}
.hero{position:relative;z-index:2}
.hero h1{font-size:64px;font-weight:800}
.hero p{font-size:20px;max-width:700px;margin:20px auto}
.btn{display:inline-block;margin-top:25px;padding:16px 32px;border-radius:50px;background:#ffb703;color:#111;font-weight:700;text-decoration:none;transition:.3s}
.btn:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.25)}
nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);backdrop-filter:blur(15px);padding:12px 28px;border-radius:50px;color:#fff;z-index:20}
section{padding:80px 8%}
h2{text-align:center;font-size:42px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
.card{background:rgba(255,255,255,.75);backdrop-filter:blur(15px);border-radius:24px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,.12);transition:.35s}
.card:hover{transform:translateY(-10px) scale(1.02)}
.card img{width:100%;height:220px;object-fit:cover}
.card div{padding:20px}
.progressWrap{position:sticky;top:0;background:#fff;padding:15px 8%;box-shadow:0 3px 10px rgba(0,0,0,.08);z-index:10}
.progress{height:12px;background:#ddd;border-radius:50px;overflow:hidden}
.bar{height:100%;width:25%;background:linear-gradient(90deg,#00b894,#ffb703);transition:.4s}
.viewer{display:grid;grid-template-columns:2fr 1fr;gap:25px}
.scene{position:relative;border-radius:25px;overflow:hidden;height:520px;background-size:cover;background-position:center;box-shadow:0 20px 45px rgba(0,0,0,.18)}
.overlay{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.label{position:absolute;left:30px;bottom:30px;color:#fff}
.hot{position:absolute;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:700;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 25px rgba(255,255,255,0)}}
.panel{background:#fff;border-radius:25px;padding:25px;box-shadow:0 15px 35px rgba(0,0,0,.12)}
button{padding:14px 18px;border:none;border-radius:14px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.box{background:#fff;padding:30px;border-radius:24px;max-width:500px}
@media(max-width:900px){.viewer{grid-template-columns:1fr}.hero h1{font-size:44px}}
</style>
</head>
<body>
<nav>🌿 ETNOLIT Virtual Tour Premium</nav>

<header>
<div class="hero">
<h1>Virtual Tour Kearifan Lokal Banjar</h1>
<p>Belajar IPS melalui pengalaman digital yang imersif, menarik, dan interaktif.</p>
<a href="#tour" class="btn">Mulai Jelajah</a>
</div>
</header>

<div class="progressWrap">
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="status">Stop 1 dari 4</p>
</div>

<section>
<h2>Empat Lokasi Jelajah</h2>
<div class="grid">
<div class="card"><img src="assets/sungai/sungai_01.jpg"><div><h3>Sungai</h3></div></div>
<div class="card"><img src="assets/perahu/perahu_01.jpg"><div><h3>Perahu</h3></div></div>
<div class="card"><img src="assets/rumah/rumah_01.jpg"><div><h3>Rumah Adat</h3></div></div>
<div class="card"><img src="assets/pertanian/pertanian_01.jpg"><div><h3>Pertanian</h3></div></div>
</div>
</section>

<section id="tour">
<h2>Virtual Tour</h2>
<div class="viewer">
<div class="scene" id="scene">
<div class="overlay"></div>
<div class="hot" style="left:20%;top:45%" onclick="info()">i</div>
<div class="label"><h2 id="ttl"></h2><p id="desc"></p></div>
</div>
<div class="panel">
<h3>Misi</h3>
<p id="mission"></p>
<button onclick="prev()">⬅ Sebelumnya</button>
<button onclick="next()">Berikutnya ➜</button>
</div>
</div>
</section>

<div class="modal" id="m"><div class="box"><h2 id="mt"></h2><p id="md"></p><button onclick="m.style.display='none'">Tutup</button></div></div>

<script>
const data=[
["Aktivitas Sungai","assets/sungai/sungai_01.jpg","Amati aktivitas masyarakat di sungai.","Temukan tiga fungsi sungai."],
["Perahu Banjar","assets/perahu/perahu_01.jpg","Perahu sebagai teknologi lokal.","Cari fungsi ekonomi perahu."],
["Rumah Adat","assets/rumah/rumah_01.jpg","Rumah panggung sebagai adaptasi.","Amati ciri rumah panggung."],
["Pertanian","assets/pertanian/pertanian_01.jpg","Pertanian pasang surut.","Jelaskan adaptasi petani."]
];
let i=0;
function render(){
scene.style.backgroundImage=`url(${data[i][1]})`;
ttl.textContent=data[i][0];
desc.textContent=data[i][2];
mission.textContent=data[i][3];
bar.style.width=((i+1)/4*100)+"%";
status.textContent=`Stop ${i+1} dari 4`;
}
function next(){i=(i+1)%4;render();}
function prev(){i=(i+3)%4;render();}
function info(){m.style.display='flex';mt.textContent=data[i][0];md.textContent=data[i][2];}
render();
</script>
</body>
</html>
